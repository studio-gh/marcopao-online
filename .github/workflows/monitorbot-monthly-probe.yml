name: Marcopão report collector

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      report_mode:
        description: "Report or sequence to collect"
        required: true
        type: choice
        options:
          - daily_yesterday
          - monthly_accumulated
          - top_value
          - top_quantity
          - ticket_average
          - sales_by_group
          - products_by_group
          - all_reports
        default: all_reports
  schedule:
    # GitHub cron is UTC. Run at 08:00, 11:00, 14:00, 17:00 and 20:00 in Rio. Pushes tagged [collect-report] also refresh data immediately.
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dashboard JavaScript syntax
        run: node scripts/validate_dashboard.mjs
      - name: Install collector test dependency
        run: python -m pip install --disable-pip-version-check "Telethon==1.45.0"
      - name: Validate collector Python syntax
        run: python -m py_compile telegram-bridge/capture_report.py tests/test_capture_report.py
      - name: Test parser and Telegram payload handling
        run: python -m unittest discover -s tests -v

  collect-report:
    needs: validate
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect-report')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job is serialized; code validation can run immediately and does not wait for Telegram.
    concurrency:
      group: marcopao-monitorbot-collector
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check "Telethon==1.45.0"
      - name: Collect reports and persist them with review status
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          BELLABYTE_PASSWORD: ${{ secrets.BELLABYTE_PASSWORD }}
                    DAILY_SALES_DAY: ${{ contains(github.event.head_commit.message, '[collect-report:sale_day:today]') && 'today' || 'yesterday' }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode || (contains(github.event.head_commit.message, '[collect-report:ticket_average]') && 'ticket_average' || contains(github.event.head_commit.message, '[collect-report:products_by_group]') && 'products_by_group' || contains(github.event.head_commit.message, '[collect-report:sales_by_group]') && 'sales_by_group' || contains(github.event.head_commit.message, '[collect-report:top_value]') && 'top_value' || contains(github.event.head_commit.message, '[collect-report:top_quantity]') && 'top_quantity' || contains(github.event.head_commit.message, '[collect-report:monthly_sales]') && 'monthly_accumulated' || contains(github.event.head_commit.message, '[collect-report:sale_day]') && 'daily_yesterday' || 'all_reports') }}
          SUPABASE_URL: "https://aeikehzlsdyklcvgjouz.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python telegram-bridge/capture_report.py
