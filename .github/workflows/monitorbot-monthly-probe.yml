name: Probe monthly sales report prompt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-monthly-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check "Telethon>=1.36,<2"
      - name: Select monthly sales report and capture prompt
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: python telegram-bridge/probe_monthly_sales.py
