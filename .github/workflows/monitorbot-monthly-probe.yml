name: Marcopão report collector

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      report_mode:
        description: "Report to collect"
        required: true
        type: choice
        options:
          - daily_yesterday
          - monthly_october
        default: daily_yesterday
  schedule:
    - cron: "10 3 * * *"

permissions:
  contents: read

jobs:
  collect-report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check "Telethon==1.45.0"
      - name: Validate dashboard JavaScript syntax
        run: node scripts/validate_dashboard.mjs
      - name: Validate collector Python syntax
        run: python -m py_compile telegram-bridge/capture_report.py tests/test_capture_report.py
      - name: Test parser with synthetic report data
        run: python -m unittest discover -s tests -v
      - name: Collect report and persist it with review status
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          BELLABYTE_PASSWORD: ${{ secrets.BELLABYTE_PASSWORD }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode || 'daily_yesterday' }}
          SUPABASE_URL: "https://aeikehzlsdyklcvgjouz.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python telegram-bridge/capture_report.py
