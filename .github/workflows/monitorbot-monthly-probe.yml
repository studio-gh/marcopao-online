name: Marcopão report collector

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      monthly_report_period:
        description: "Optional month for a single historical monthly sales capture, YYYY-MM"
        required: false
        type: string
      monthly_backfill_start:
        description: "First month in the reverse-chronological historical backfill, YYYY-MM"
        required: false
        type: string
      monthly_backfill_end:
        description: "Last month in the reverse-chronological historical backfill, YYYY-MM"
        required: false
        type: string
      report_mode:
        description: "Report or sequence to collect"
        required: true
        type: choice
        options:
          - daily_yesterday
          - daily_today
          - monthly_accumulated
          - top_value
          - top_quantity
          - ticket_average
          - sales_by_group
          - products_by_group
          - all_reports
          - monthly_backfill
        default: all_reports
  schedule:
    # GitHub cron is UTC. Run at 08:00, 11:00, 14:00, 17:00 and 20:00 in Rio. Pushes tagged [collect-report] also refresh data immediately.
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dashboard JavaScript syntax
        run: node scripts/validate_dashboard.mjs
      - name: Install collector test dependency
        run: python -m pip install --disable-pip-version-check "Telethon==1.45.0"
      - name: Validate collector Python syntax
        run: python -m py_compile telegram-bridge/capture_report.py tests/test_capture_report.py
      - name: Test parser and Telegram payload handling
        run: python -m unittest discover -s tests -v

  collect-report:
    needs: validate
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect-report')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job is serialized; code validation can run immediately and does not wait for Telegram.
    concurrency:
      group: marcopao-monitorbot-collector
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check "Telethon==1.45.0"
      - name: Resolve tagged historical month or backfill range
        shell: bash
        env:
          INPUT_MONTHLY_REPORT_PERIOD: ${{ inputs.monthly_report_period }}
        run: |
          python - <<'PY'
          import json, os, re
          period = os.environ.get("INPUT_MONTHLY_REPORT_PERIOD", "").strip()
          start = end = ""
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
                  event = json.load(f)
              message = event.get("head_commit", {}).get("message", "")
              match = re.search(r"\[collect-report:monthly_sales:(20\d{2}-(?:0[1-9]|1[0-2]))\]", message)
              if match:
                  period = match.group(1)
              backfill = re.search(r"\[collect-report:monthly_backfill:(20\d{2}-(?:0[1-9]|1[0-2])):(20\d{2}-(?:0[1-9]|1[0-2]))\]", message)
              if backfill:
                  start, end = backfill.groups()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              if period:
                  env.write(f"MONTHLY_REPORT_PERIOD={period}\n")
                  print(f"Monthly sales target set to {period}")
              if start and end:
                  env.write(f"MONTHLY_BACKFILL_START={start}\n")
                  env.write(f"MONTHLY_BACKFILL_END={end}\n")
                  print(f"Monthly historical backfill set to {start} through {end}")
          if not period and not (start and end):
              print("No explicit monthly target supplied; collector default applies.")
          PY
      - name: Collect reports and persist them with review status
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          BELLABYTE_PASSWORD: ${{ secrets.BELLABYTE_PASSWORD }}
          DAILY_SALES_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode == 'daily_today' && 'today' || github.event_name == 'schedule' && github.event.schedule != '0 11 * * *' && 'today' || contains(github.event.head_commit.message, '[collect-report:sale_day:today]') && 'today' || 'yesterday' }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.report_mode == 'daily_today' && 'daily_yesterday' || inputs.report_mode) || (contains(github.event.head_commit.message, '[collect-report:monthly_backfill:') && 'monthly_backfill' || contains(github.event.head_commit.message, '[collect-report:ticket_average]') && 'ticket_average' || contains(github.event.head_commit.message, '[collect-report:products_by_group]') && 'products_by_group' || contains(github.event.head_commit.message, '[collect-report:sales_by_group]') && 'sales_by_group' || contains(github.event.head_commit.message, '[collect-report:top_value]') && 'top_value' || contains(github.event.head_commit.message, '[collect-report:top_quantity]') && 'top_quantity' || contains(github.event.head_commit.message, '[collect-report:monthly_sales:') && 'monthly_accumulated' || contains(github.event.head_commit.message, '[collect-report:monthly_sales]') && 'monthly_accumulated' || contains(github.event.head_commit.message, '[collect-report:sale_day:today]') && 'daily_yesterday' || contains(github.event.head_commit.message, '[collect-report:sale_day]') && 'daily_yesterday' || 'all_reports') }}
          MONTHLY_BACKFILL_START: ${{ inputs.monthly_backfill_start }}
          MONTHLY_BACKFILL_END: ${{ inputs.monthly_backfill_end }}
          SUPABASE_URL: "https://aeikehzlsdyklcvgjouz.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python telegram-bridge/capture_report.py
