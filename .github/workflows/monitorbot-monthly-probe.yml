name: Marcopão report collector

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      report_mode:
        description: "Report or sequence to collect"
        required: true
        type: choice
        options:
          - daily_yesterday
          - monthly_accumulated
          - top_value
          - top_quantity
          - ticket_average
          - sales_by_group
          - products_by_group
          - all_reports
        default: all_reports
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"

permissions:
  contents: read

# This collector controls one shared Telegram conversation. Never run two copies concurrently.
# Live collection runs on schedule/manual dispatch, or a deliberate push commit tagged [collect-report].
concurrency:
  group: marcopao-monitorbot-collector
  cancel-in-progress: false

jobs:
  collect-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check "Telethon==1.45.0"
      - name: Validate dashboard JavaScript syntax
        run: node scripts/validate_dashboard.mjs
      - name: Validate collector Python syntax
        run: python -m py_compile telegram-bridge/capture_report.py tests/test_capture_report.py
      - name: Test parser with synthetic report data
        run: python -m unittest discover -s tests -v
      - name: Collect report and persist it with review status
        # Code pushes validate only. Live Telegram collection requires an intentional [collect-report] commit,
        # manual workflow dispatch, or the daily schedule.
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect-report]')
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          BELLABYTE_PASSWORD: ${{ secrets.BELLABYTE_PASSWORD }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode || 'all_reports' }}
          SUPABASE_URL: "https://aeikehzlsdyklcvgjouz.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python telegram-bridge/capture_report.py
