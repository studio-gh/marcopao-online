name: Monitorbot read-only connection check

on:
  workflow_dispatch:
  # Scheduling is intentionally disabled until the Telegram session and query flow
  # have been validated. Enable a cron only after an approved end-to-end test.

permissions:
  contents: read

jobs:
  check-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check "Telethon>=1.36,<2"
      - name: Check Telegram bot access (read-only)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: python telegram-bridge/observe_bot.py
